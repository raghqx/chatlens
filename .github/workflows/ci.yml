name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Deterministic tests and golden evals. No API key, no network, no cost.
      # The LLM-judge suite (`npm run eval`) is deliberately not run here: it
      # bills a real key and its verdicts are not stable enough to gate a merge.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
